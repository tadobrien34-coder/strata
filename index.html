<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Strata — descent prototype</title>
<style>
  :root{
    --ink:#0A0C14;
    --bone:#EAE6DA;
    --coin:#F2C14E;
    --crush:#E5484D;
    --dim:rgba(234,230,218,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--ink);overflow:hidden;
    font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;
    color:var(--bone);-webkit-user-select:none;user-select:none;touch-action:none}
  #stage{position:relative;width:100%;height:100%;display:grid;place-items:center}
  #frame{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;overflow:hidden;
    box-shadow:0 0 0 1px rgba(234,230,218,.12)}
  canvas{display:block;width:100%;height:100%}

  .hud{position:absolute;inset:0;pointer-events:none}
  .depth{position:absolute;top:18px;left:18px;line-height:.9}
  .depth b{display:block;font-size:44px;font-weight:600;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums}
  .depth span{font-size:12px;letter-spacing:.06em;color:var(--dim)}
  .purse{position:absolute;top:22px;right:18px;display:flex;align-items:center;gap:7px;
    font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
  .purse i{width:13px;height:13px;border-radius:50%;background:var(--coin);
    box-shadow:inset -3px -3px 0 rgba(0,0,0,.18);display:block}
  .bandname{position:absolute;top:78px;left:18px;font-size:12px;letter-spacing:.1em;
    color:var(--dim);transition:opacity .4s}

  .veil{position:absolute;inset:0;display:grid;place-items:center;pointer-events:auto;
    background:rgba(10,12,20,.82);backdrop-filter:blur(7px);padding:28px;text-align:center}
  .veil.shop{display:block;overflow-y:auto;padding-top:22px}
  .veil.gone{display:none}
  .shopHead{display:flex;justify-content:space-between;align-items:center;max-width:420px;margin:0 auto 14px}
  .shopHead h2{font-size:26px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:420px;margin:0 auto}
  .sk{background:rgba(234,230,218,.05);border-radius:12px;padding:12px 4px 9px;cursor:pointer;
    box-shadow:inset 0 0 0 1px rgba(234,230,218,.1);transition:transform .12s}
  .sk:active{transform:scale(.95)}
  .sk.on{box-shadow:inset 0 0 0 2px var(--coin)}
  .sk.locked{opacity:.4}
  .sk i{display:block;width:30px;height:30px;border-radius:50%;margin:0 auto 8px;background:var(--c);
    box-shadow:0 0 0 2px var(--rim,transparent)}
  .sk.glow i{box-shadow:0 0 14px var(--g),0 0 0 2px var(--rim,transparent)}
  .sk b{display:block;font-size:10px;letter-spacing:.08em;font-weight:600}
  .sk span{display:block;font-size:10px;color:var(--dim);margin-top:3px;font-variant-numeric:tabular-nums}
  .sk .p{color:var(--coin)}
  .shopHint{margin-top:16px;font-size:11px;color:var(--dim);text-align:center}
  .veil h1{font-size:clamp(38px,13vw,68px);font-weight:600;letter-spacing:-.045em;line-height:.92}
  .veil h2{font-size:34px;font-weight:600;letter-spacing:-.03em}
  .veil p{margin-top:12px;font-size:15px;color:var(--dim);max-width:30ch;line-height:1.5}
  .stat{margin-top:22px;display:flex;gap:26px;justify-content:center}
  .stat div{font-size:11px;letter-spacing:.08em;color:var(--dim)}
  .stat b{display:block;font-size:28px;font-weight:600;color:var(--bone);
    letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-bottom:3px}
  button{font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--bone);
    border:0;border-radius:999px;padding:15px 30px;margin-top:26px;cursor:pointer;
    transition:transform .12s ease}
  button:active{transform:scale(.96)}
  button.ghost{background:transparent;color:var(--bone);box-shadow:inset 0 0 0 1px rgba(234,230,218,.3);
    margin-top:12px;font-weight:500}
  button.gold{background:var(--coin)}
  button:focus-visible{outline:2px solid var(--coin);outline-offset:3px}
  .hint{margin-top:20px;font-size:12px;color:var(--dim)}
  .mute{position:absolute;bottom:16px;right:16px;pointer-events:auto;margin:0;padding:8px 12px;
    font-size:11px;letter-spacing:.08em;font-weight:500;background:transparent;color:var(--dim);
    box-shadow:inset 0 0 0 1px rgba(234,230,218,.25)}
  @media (prefers-reduced-motion:reduce){button{transition:none}}
</style>

<div id="stage"><div id="frame">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="depth"><b id="dep">0</b><span>metres down</span></div>
    <div class="purse"><i></i><span id="coins">0</span></div>
    <div class="bandname" id="band"></div>
    <button class="mute" id="muteBtn" aria-pressed="false">SOUND ON</button>
  </div>

  <div class="veil" id="start">
    <div>
      <h1>Strata</h1>
      <p>Steer as you fall. Clip a ledge and you stall — and the crusher above never stalls.</p>
      <div class="stat"><div><b id="sBest">0</b>BEST</div><div><b id="sBank">0</b>BANK</div></div>
      <button id="go">Start falling</button>
      <button class="ghost" id="shopS">Skins</button>
      <div class="hint">Drag anywhere, or use ← →. Space to start.</div>
    </div>
  </div>

  <div class="veil shop gone" id="shop">
    <div class="shopHead"><h2>Skins</h2><div class="purse" style="position:static"><i></i><span id="shopBank">0</span></div></div>
    <div class="grid" id="grid"></div>
    <div class="shopHint">Cosmetic only. Depth skins are earned, never sold.</div>
    <div style="text-align:center"><button class="ghost" id="shopBack">Back</button></div>
  </div>

  <div class="veil gone" id="over">
    <div>
      <h2 id="overTitle">Crushed</h2>
      <div class="stat">
        <div><b id="fDep">0</b>METRES</div>
        <div><b id="fCoin">0</b>COINS</div>
        <div><b id="fBest">0</b>BEST</div>
        <div><b id="fBank">0</b>BANK</div>
      </div>
      <button class="gold" id="revive">Keep falling — watch ad</button>
      <button class="ghost" id="again">Drop again</button>
      <button class="ghost" id="shopO">Skins</button>
    </div>
  </div>
</div></div>

<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function fit(){const r=cv.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,2.5);
  W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',fit);

// ── strata: each band is a depth range with its own palette ──────────────
const BANDS=[
 {at:0,   name:'TOPSOIL',   bg:'#1B2419', rock:'#3E4B33', grit:'#5D6B48'},
 {at:220, name:'LIMESTONE', bg:'#131C26', rock:'#2E4356', grit:'#48637A'},
 {at:480, name:'GEODE',     bg:'#191428', rock:'#3C2E60', grit:'#6A4FA3'},
 {at:760, name:'MAGMA',     bg:'#210F12', rock:'#5A2224', grit:'#9C3A2C'},
 {at:1080,name:'THE CORE',  bg:'#0C0A0E', rock:'#2A2230', grit:'#C4542F'},
];
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);
  return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`;};
function palette(m){
  let i=0; while(i<BANDS.length-1 && m>=BANDS[i+1].at) i++;
  const a=BANDS[i], b=BANDS[Math.min(i+1,BANDS.length-1)];
  const t=b.at>a.at?Math.min(1,Math.max(0,(m-a.at)/(b.at-a.at))):0;
  return {name:a.name, bg:mix(a.bg,b.bg,t), rock:mix(a.rock,b.rock,t), grit:mix(a.grit,b.grit,t)};
}

// ── tuning ───────────────────────────────────────────────────────────────
const PPM=6;            // pixels per metre
const GRAV=950, STEER=28;   // GRAV 950: ~0.7s from a stall back to terminal, so every stall costs real slack
const KEYSPD=680;       // px/s for arrow keys
const R=13;             // player radius

let P, rows, coinsArr, bits, crusherY, depth, coins, shake=0, running=false, revived=false;
// persisted: best depth and the coin bank (cosmetics currency — never buys power, see CLAUDE.md §5)
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:+v}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let best=load('strata.best',0), bank=load('strata.bank',0), banked=0;

// ── skins: cosmetics only (CLAUDE.md §5). price → bought from the bank; depth → earned by best depth. ──
// fx: 'glow' = shadow halo; 'molten' = colour cycles + sheds embers. rim = stroke, for dark balls.
const SKINS=[
 {id:'bone',    name:'BONE',    ball:'#EAE6DA',trail:'#EAE6DA',price:0},
 {id:'ash',     name:'ASH',     ball:'#9A9A96',trail:'#9A9A96',price:50},
 {id:'slate',   name:'SLATE',   ball:'#6B7A8C',trail:'#6B7A8C',price:50},
 {id:'moss',    name:'MOSS',    ball:'#7A9A3F',trail:'#7A9A3F',price:50},
 {id:'clay',    name:'CLAY',    ball:'#B5654A',trail:'#B5654A',price:50},
 {id:'ochre',   name:'OCHRE',   ball:'#C89B3C',trail:'#C89B3C',price:50},
 {id:'indigo',  name:'INDIGO',  ball:'#5B5FB5',trail:'#5B5FB5',price:50},
 {id:'plum',    name:'PLUM',    ball:'#8E4A80',trail:'#8E4A80',price:50},
 {id:'teal',    name:'TEAL',    ball:'#2F8F8A',trail:'#2F8F8A',price:50},
 {id:'brick',   name:'BRICK',   ball:'#A63D2E',trail:'#A63D2E',price:50},
 {id:'sand',    name:'SAND',    ball:'#D9C29A',trail:'#D9C29A',price:50},
 {id:'copper',  name:'COPPER',  ball:'#B87333',trail:'#E8A45C',price:100},
 {id:'jade',    name:'JADE',    ball:'#3FA37A',trail:'#8FE0B8',price:100},
 {id:'blood',   name:'BLOOD',   ball:'#8A0F1A',trail:'#E5484D',price:100},
 {id:'cobalt',  name:'COBALT',  ball:'#1F4FBF',trail:'#6FA0FF',price:100},
 {id:'ivory',   name:'IVORY',   ball:'#F7F2E4',trail:'#C9B98A',rim:'#8C7A4F',price:100},
 {id:'ember',   name:'EMBER',   ball:'#FF6B1A',trail:'#FF6B1A',fx:'glow',price:500},
 {id:'ghost',   name:'GHOST',   ball:'#DDE6FF',trail:'#DDE6FF',fx:'glow',price:500},
 {id:'venom',   name:'VENOM',   ball:'#7CFF3A',trail:'#7CFF3A',fx:'glow',price:500},
 {id:'molten',  name:'MOLTEN',  ball:'#FF7A1A',trail:'#FF7A1A',fx:'molten',price:1000},
 // depth tier: one per band reached, plus one past the core
 {id:'chalk',   name:'CHALK',   ball:'#C9D1D9',trail:'#C9D1D9',depth:220},
 {id:'amethyst',name:'AMETHYST',ball:'#9B6BFF',trail:'#9B6BFF',fx:'glow',depth:480},
 {id:'magma',   name:'MAGMA',   ball:'#FF4E2B',trail:'#FF4E2B',fx:'glow',depth:760},
 {id:'obsidian',name:'OBSIDIAN',ball:'#141018',trail:'#C4542F',rim:'#C4542F',depth:1080},
 {id:'void',    name:'VOID',    ball:'#000000',trail:'#EAE6DA',rim:'#EAE6DA',fx:'glow',depth:1500},
];
let owned=new Set(['bone']); try{owned=new Set(JSON.parse(localStorage.getItem('strata.owned')||'["bone"]'))}catch(e){}
const unlocked=s=>s.depth!==undefined ? best>=s.depth : owned.has(s.id);
let skin=SKINS.find(s=>{try{return s.id===localStorage.getItem('strata.skin')}catch(e){return false}})||SKINS[0];
if(!unlocked(skin)) skin=SKINS[0];
function equip(s){ skin=s; save('strata.skin',s.id); }
function buy(s){ if(s.price===undefined||bank<s.price) return false;
  bank-=s.price; save('strata.bank',bank); owned.add(s.id); save('strata.owned',JSON.stringify([...owned])); return true; }
let targetX=null, keyL=false, keyR=false, lastT=0;

// ── difficulty ramp. Everything is a function of metres so a level system can swap these later. ──
function vmax(m){ return Math.min(780, 470 + m*0.3); }          // terminal velocity: 470 px/s at the top, 780 by ~1030m
function rowGap(m){ return 340; }                               // ledge spacing is flat; speed alone carries the ramp
                                                                // reaction time per ledge (rowGap/vmax): 0.72s → 0.44s
function gapWidth(m){ return Math.max(100, 190 - m*0.05); }     // base gap width; build() jitters it. Ball is 26px
const GAPVAR=.25;       // per-row jitter, ±25%: rare tight gaps, rare wide ones
// reachability: every ledge must be physically possible. The next gap may sit no further sideways
// than a thumb covers in (time between ledges − reaction). REACT is the allowance, HSPEED the thumb.
const REACT=.2, HSPEED=520;
function reach(m){ return Math.max(50,(rowGap(m)/vmax(m)-REACT)*HSPEED); }
let lastGx=null;
// crusher as a fraction of terminal velocity: 55% at the top, 90% by ~875m. Falling clean ALWAYS
// outruns it; only stalls close the distance. This ratio is the suspense variable — tune it last.
function crusherSpeed(m){ return vmax(m)*Math.min(.9, .55 + m*0.0004); }

function reset(){
  P={x:W/2,y:0,vx:0,vy:0,stun:0};
  rows=[];coinsArr=[];bits=[];lastGx=null;
  crusherY=-520;depth=0;coins=0;revived=false;shake=0;streak=0;banked=0;
  for(let i=0,y=0;i<10;i++){ y+=rowGap(y/PPM); build(y); }
}
function build(y){
  const m=y/PPM, gw=gapWidth(m)*(1+(Math.random()*2-1)*GAPVAR), edge=gw/2+40;   // 40: gaps never hug the wall
  const rc=reach(m), c=lastGx??W/2, lo=Math.max(edge,c-rc), hi=Math.min(W-edge,c+rc);
  const gx=lo+Math.random()*Math.max(0,hi-lo); lastGx=gx;
  rows.push({y,gx,gw,hit:false});
  // coins sit in the gap and just past it — reward for threading cleanly
  const n=1+(Math.random()<.45?1:0)+(m>400&&Math.random()<.3?1:0);
  for(let i=0;i<n;i++) coinsArr.push({x:gx+(Math.random()-.5)*gw*.55,y:y+22+i*26,got:false,t:Math.random()*6});
}

// ── haptics: iOS Safari ignores this entirely. See QA notes. ─────────────
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

// ── audio: Web Audio synthesis, no files. Context is created on the first tap (iOS rule). ──
// Sound is the one feedback channel that works on iPhone today — see CLAUDE.md §3.
let AC=null, master=null, drone=null, noiseBuf=null, streak=0;
let muted=false; try{muted=localStorage.getItem('strata.mute')==='1'}catch(e){}
function audioInit(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=muted?0:1; master.connect(AC.destination);
  // one second of white noise, reused for thuds and the death crunch
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  // crusher drone: low saw through a lowpass; step() opens the gain as the crusher closes in
  const o=AC.createOscillator(), f=AC.createBiquadFilter(); drone=AC.createGain();
  o.type='sawtooth'; o.frequency.value=36; f.type='lowpass'; f.frequency.value=110; drone.gain.value=0;
  o.connect(f); f.connect(drone); drone.connect(master); o.start();
}
// one oscillator, pitch f0→f1 over dur seconds, exponential fade
function tone(type,f0,f1,dur,vol){
  const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur);
}
// lowpassed noise burst
function noise(cut,dur,vol){
  const t=AC.currentTime, s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
  s.buffer=noiseBuf; f.type='lowpass'; f.frequency.value=cut;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+dur);
}
const sfx={
  // two-note ring, B5 then E6, the second held. Streak nudges the whole thing up a
  // semitone per coin (cap 6) so a clean run climbs; a ledge hit resets it.
  coin(){ if(!AC)return;
    const k=Math.pow(2,Math.min(streak,6)/12), t=AC.currentTime;
    for(const [type,vol] of [['square',.05],['sine',.14]]){
      const o=AC.createOscillator(), g=AC.createGain(); o.type=type;
      o.frequency.setValueAtTime(988*k,t); o.frequency.setValueAtTime(1319*k,t+.07);
      g.gain.setValueAtTime(vol,t); g.gain.setValueAtTime(vol,t+.07);
      g.gain.exponentialRampToValueAtTime(.001,t+.38);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+.38);
    }
  },
  thud(){ if(!AC)return; noise(420,.14,.5); tone('sine',95,42,.16,.45); },
  death(){ if(!AC)return; noise(900,.5,.6); tone('sawtooth',300,44,.65,.3);
    drone.gain.cancelScheduledValues(AC.currentTime); drone.gain.setTargetAtTime(0,AC.currentTime,.05); },
  revive(){ if(!AC)return; tone('sine',330,660,.22,.2); },
};
function setMute(m){
  muted=m; try{localStorage.setItem('strata.mute',m?'1':'0')}catch(e){}
  if(master) master.gain.setTargetAtTime(m?0:1,AC.currentTime,.02);
  muteBtn.textContent=m?'SOUND OFF':'SOUND ON'; muteBtn.setAttribute('aria-pressed',m);
}
addEventListener('visibilitychange',()=>{ if(AC&&!document.hidden) AC.resume(); });

function input(){
  addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keyL=true;if(e.key==='ArrowRight')keyR=true;});
  addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keyL=false;if(e.key==='ArrowRight')keyR=false;});
  const set=e=>{const r=cv.getBoundingClientRect();targetX=(e.touches?e.touches[0].clientX:e.clientX)-r.left;};
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);set(e)});
  cv.addEventListener('pointermove',e=>{if(e.pressure>0||e.buttons)set(e)});
  cv.addEventListener('pointerup',()=>targetX=null);
}

function step(dt){
  // steer
  if(targetX!==null) P.x+=(targetX-P.x)*Math.min(1,dt*STEER);
  if(keyL) P.x-=KEYSPD*dt; if(keyR) P.x+=KEYSPD*dt;
  P.x=Math.max(R,Math.min(W-R,P.x));

  // fall
  P.vy=Math.min(vmax(depth),P.vy+GRAV*dt);
  if(P.stun>0){P.stun-=dt;P.vy=Math.min(P.vy,110);}
  P.y+=P.vy*dt;
  depth=Math.max(depth,P.y/PPM);

  crusherY+=crusherSpeed(depth)*dt;
  if(P.y-crusherY<R*1.4) return die();
  // drone is silent with full slack, loud in the last ~560px before it eats you
  if(drone){ const prox=Math.max(0,1-(P.y-crusherY)/560); drone.gain.setTargetAtTime(prox*prox*.28,AC.currentTime,.08); }

  // ledges
  for(const r of rows){
    if(P.y+R>r.y && P.y-R<r.y+16 && !r.hit){
      // d = how far the centre sits outside the gap; negative means inside it
      const d=Math.max(r.gx-r.gw/2-P.x, P.x-(r.gx+r.gw/2));
      if(d>-R*.5){   // stall. Ledges never kill; the crusher eats the slack this costs
        r.hit=true;P.y=r.y-R;P.vy=0;streak=0;P.stun=.42;shake=13;buzz([18,26,18]);sfx.thud();
        for(let i=0;i<9;i++)bits.push({x:P.x,y:P.y+R,vx:(Math.random()-.5)*230,vy:-Math.random()*170,l:.5,c:'rock'});
      }
    }
  }
  // coins
  for(const c of coinsArr){
    if(c.got)continue; c.t+=dt*4;
    if(Math.hypot(c.x-P.x,c.y-P.y)<R+13){
      c.got=true;coins++;streak++;buzz(9);sfx.coin();
      for(let i=0;i<7;i++)bits.push({x:c.x,y:c.y,vx:(Math.random()-.5)*200,vy:(Math.random()-.5)*200,l:.45,c:'coin'});
    }
  }
  for(const b of bits){b.l-=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=900*dt;}
  if(skin.fx==='molten'&&P.vy>200&&Math.random()<.5)
    bits.push({x:P.x+(Math.random()-.5)*R*1.6,y:P.y,vx:(Math.random()-.5)*60,vy:-P.vy*.15,l:.4,c:'ember'});
  bits=bits.filter(b=>b.l>0);

  // stream in / cull
  const deepest=rows[rows.length-1].y;
  if(deepest-P.y<H*2.2) build(deepest+rowGap(deepest/PPM));
  rows=rows.filter(r=>r.y>crusherY-260);
  coinsArr=coinsArr.filter(c=>!c.got&&c.y>crusherY-260);
  if(shake>0)shake*=.86;
}

function die(){
  running=false;buzz([40,60,110]);sfx.death();
  best=Math.max(best,Math.round(depth)); save('strata.best',best);
  bank+=coins-banked; banked=coins; save('strata.bank',bank);   // banked guards the revive double-count
  fDep.textContent=Math.round(depth);fCoin.textContent=coins;fBest.textContent=best;fBank.textContent=bank;
  revive.style.display=revived?'none':'';
  overTitle.textContent=revived?'Crushed again':'Crushed';
  over.classList.remove('gone');
}

function draw(){
  const pal=palette(depth), camY=P.y-H*0.38;
  const sx=(Math.random()-.5)*shake, sy=(Math.random()-.5)*shake;
  cx.save();cx.translate(sx,sy);
  cx.fillStyle=pal.bg;cx.fillRect(-20,-20,W+40,H+40);

  // parallax grit veins
  cx.strokeStyle=pal.rock;cx.globalAlpha=.5;cx.lineWidth=1;
  for(let i=0;i<16;i++){
    const y=((i*137 - camY*0.35)%(H+160))-80, w=30+((i*53)%90);
    cx.beginPath();cx.moveTo((i*97)%W,y);cx.lineTo((i*97)%W+w,y+9);cx.stroke();
  }
  cx.globalAlpha=1;

  // ledges
  for(const r of rows){
    const y=r.y-camY; if(y<-40||y>H+40)continue;
    cx.fillStyle=pal.rock;
    cx.fillRect(0,y,r.gx-r.gw/2,15);
    cx.fillRect(r.gx+r.gw/2,y,W-(r.gx+r.gw/2),15);
    cx.fillStyle=pal.grit;
    cx.fillRect(0,y,r.gx-r.gw/2,3);
    cx.fillRect(r.gx+r.gw/2,y,W-(r.gx+r.gw/2),3);
  }

  // coins
  for(const c of coinsArr){
    const y=c.y-camY; if(y<-30||y>H+30)continue;
    const w=Math.abs(Math.cos(c.t))*9+2.5;
    cx.fillStyle='#F2C14E';cx.beginPath();cx.ellipse(c.x,y,w,9.5,0,0,7);cx.fill();
    cx.fillStyle='rgba(0,0,0,.16)';cx.beginPath();cx.ellipse(c.x,y+1.5,w*.5,5,0,0,7);cx.fill();
  }

  // debris
  for(const b of bits){cx.globalAlpha=Math.max(0,b.l*2);
    cx.fillStyle=b.c==='coin'?'#F2C14E':b.c==='ember'?'#FF7A1A':pal.grit;cx.fillRect(b.x,b.y-camY,3,3);}
  cx.globalAlpha=1;

  // player + trail
  const py=P.y-camY, sk=skin;
  const ballC=sk.fx==='molten'?mix('#FFB300','#FF3D00',(Math.sin(performance.now()/140)+1)/2):sk.ball;
  const [tr,tg,tb]=hex(sk.trail), g=cx.createLinearGradient(0,py-46,0,py);
  g.addColorStop(0,`rgba(${tr},${tg},${tb},0)`);g.addColorStop(1,`rgba(${tr},${tg},${tb},.3)`);
  cx.fillStyle=g;cx.fillRect(P.x-4,py-46,8,46);
  if(sk.fx){cx.shadowBlur=20;cx.shadowColor=sk.rim||ballC;}
  cx.fillStyle=ballC;cx.beginPath();cx.arc(P.x,py,R,0,7);cx.fill();
  cx.shadowBlur=0;
  if(sk.rim){cx.strokeStyle=sk.rim;cx.lineWidth=2;cx.beginPath();cx.arc(P.x,py,R-1,0,7);cx.stroke();}
  cx.fillStyle=P.stun>0?'#E5484D':(sk.rim||pal.bg);cx.beginPath();cx.arc(P.x,py-2,4.5,0,7);cx.fill();

  // crusher
  const cy=crusherY-camY;
  if(cy>-200){
    const cg=cx.createLinearGradient(0,cy-170,0,cy);
    cg.addColorStop(0,'rgba(10,12,20,.98)');cg.addColorStop(1,'rgba(229,72,77,.9)');
    cx.fillStyle=cg;cx.fillRect(0,cy-170,W,170);
    cx.fillStyle='#E5484D';
    for(let i=0;i<W/22;i++){cx.beginPath();cx.moveTo(i*22,cy);cx.lineTo(i*22+11,cy+15);cx.lineTo(i*22+22,cy);cx.fill();}
  }
  cx.restore();

  dep.textContent=Math.round(depth);
  coins_.textContent=coins;
  band.textContent=pal.name;
}

function loop(t){
  const dt=Math.min(.033,(t-lastT)/1000||0);lastT=t;
  if(running)step(dt);
  draw();requestAnimationFrame(loop);
}

const dep=document.getElementById('dep'),coins_=document.getElementById('coins'),
      band=document.getElementById('band'),over=document.getElementById('over'),
      fDep=document.getElementById('fDep'),fCoin=document.getElementById('fCoin'),
      fBest=document.getElementById('fBest'),revive=document.getElementById('revive'),
      overTitle=document.getElementById('overTitle'),muteBtn=document.getElementById('muteBtn'),
      fBank=document.getElementById('fBank'),sBest=document.getElementById('sBest'),sBank=document.getElementById('sBank'),
      startVeil=document.getElementById('start'),goBtn=document.getElementById('go'),againBtn=document.getElementById('again');

goBtn.onclick=()=>{audioInit();fit();reset();startVeil.classList.add('gone');running=true;};
againBtn.onclick=()=>{audioInit();fit();reset();over.classList.add('gone');running=true;};
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!shop.classList.contains('gone')) return closeShop();
  if(e.key!==' '&&e.key!=='Enter')return; e.preventDefault();
  if(!shop.classList.contains('gone')) return;
  if(!startVeil.classList.contains('gone')) goBtn.click();
  else if(!over.classList.contains('gone')) againBtn.click();
});

// ── shop ──
const shop=document.getElementById('shop'),grid=document.getElementById('grid'),shopBank=document.getElementById('shopBank');
let shopFrom=null;
function openShop(from){ audioInit(); shopFrom=from; from.classList.add('gone'); renderShop(); shop.classList.remove('gone'); }
function closeShop(){ shop.classList.add('gone'); shopFrom.classList.remove('gone'); sBank.textContent=bank; fBank.textContent=bank; }
function renderShop(){
  shopBank.textContent=bank; grid.innerHTML='';
  for(const s of SKINS){
    const un=unlocked(s), el=document.createElement('div');
    el.className='sk'+(s.fx?' glow':'')+(s===skin?' on':'')+(un?'':' locked');
    el.style.setProperty('--c',s.ball); el.style.setProperty('--g',s.rim||s.ball); if(s.rim) el.style.setProperty('--rim',s.rim);
    const tag=s===skin?'EQUIPPED':un?'OWNED':s.depth!==undefined?`REACH ${s.depth}m`:`<span class="p">${s.price} coins</span>`;
    el.innerHTML=`<i></i><b>${s.name}</b><span>${tag}</span>`;
    el.onclick=()=>{
      if(un){ equip(s); sfx.revive(); }
      else if(buy(s)){ equip(s); sfx.coin(); }
      else { sfx.thud(); return; }
      renderShop();
    };
    grid.appendChild(el);
  }
}
document.getElementById('shopS').onclick=()=>openShop(startVeil);
document.getElementById('shopO').onclick=()=>openShop(over);
document.getElementById('shopBack').onclick=closeShop;
revive.onclick=()=>{ // stand-in for a rewarded-video continue
  audioInit();revived=true;crusherY=P.y-620;P.vy=0;P.stun=0;
  over.classList.add('gone');running=true;buzz([12,40,12]);sfx.revive();
};
muteBtn.onclick=()=>{audioInit();setMute(!muted);};
setMute(muted);sBest.textContent=best;sBank.textContent=bank;

fit();input();reset();requestAnimationFrame(loop);
</script>
